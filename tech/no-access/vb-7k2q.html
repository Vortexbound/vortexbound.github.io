<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>???</title>
  <link rel="icon" type="image/png" href="../../content/icon3.png">
<link rel="stylesheet" href="../../style.css">
<style>
  [hidden] { display: none !important; }
  .stage {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,58,58,0.07), transparent 65%);
  }
  .panel {
    position: relative; width: 100%; max-width: 520px;
    border: 1px solid var(--line); background: var(--panel); padding: 34px 28px 30px;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--accent-dim);
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .kicker { margin: 0 0 22px; font-size: 12px; color: var(--dim); }
  .kicker i { display: inline-block; width: 7px; height: 7px; background: var(--accent); margin-right: 8px; animation: pulse 2s infinite; }
  .prompt { display: block; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  .field { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .field:focus-within { border-color: var(--accent-dim); }
  .field span { color: var(--accent); }
  .field input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
    font: inherit; font-size: 18px; letter-spacing: 3px; caret-color: var(--accent); caret-shape: block;
  }
  #status { margin: 16px 0 0; min-height: 1.6em; font-size: 12px; color: var(--dim); }
  #status.err { color: var(--accent); }
  .shake { animation: shake 0.35s; }
  .digits { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; margin: 6px 0 4px; }
  .digits .cell { text-align: center; }
  .num {
    display: block; font-family: 'Space Mono', monospace; font-weight: 700; color: var(--accent);
    font-size: clamp(2rem, 10vw, 3.6rem); line-height: 1.1; text-shadow: 0 0 18px rgba(255,58,58,0.35);
  }
  .unit { font-size: 11px; color: var(--dim); }
  .colon { font-size: clamp(1.6rem, 8vw, 2.8rem); color: var(--line); animation: pulse 1s steps(2) infinite; }
  #when { margin: 22px 0 0; font-size: 12px; color: var(--dim); }
  #after { margin: 14px 0 0; color: var(--text); }
  @keyframes pulse { 50% { opacity: 0.25; } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main class="stage">

  <section class="panel" id="lock">
    <p class="kicker"><i></i>{/..} restricted</p>
    <form id="form" autocomplete="off">
      <label class="prompt" for="code">enter access code</label>
      <div class="field">
        <span>&gt;</span>
        <input id="code" name="access-code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="31" autofocus>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite">waiting for input</p>
    <noscript><p class="kicker">javascript required</p></noscript>
  </section>

  <section class="panel" id="clock" hidden>
    <p class="kicker"><i></i>{/..} transmission scheduled</p>
    <div class="digits">
      <div class="cell"><span class="num" id="d">00</span><span class="unit">days</span></div>
      <span class="colon">:</span>
      <div class="cell"><span class="num" id="h">00</span><span class="unit">hours</span></div>
      <span class="colon">:</span>
      <div class="cell"><span class="num" id="m">00</span><span class="unit">min</span></div>
      <span class="colon">:</span>
      <div class="cell"><span class="num" id="s">00</span><span class="unit">sec</span></div>
    </div>
    <p id="when"></p>
    <p id="after" hidden></p>
  </section>

</main>
